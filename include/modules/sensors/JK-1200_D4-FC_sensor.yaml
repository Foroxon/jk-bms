- platform: modbus_controller
  modbus_controller_id: ${modbus_contr_id}
  name: "${name} Emergency switch time"             # TimeEmergency
  icon: mdi:clock-outline
  # address: 0x12D4
  # address: 0x1200
  # offset: 0x00D4
  address: 0x12D4
  offset: 0x0000
  register_type: holding
  value_type: U_WORD
